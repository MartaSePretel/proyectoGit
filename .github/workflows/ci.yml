name: Prueba tokens

on: push

jobs:
  comparar:
    runs-on: self-hosted
    steps:
      - name: Depurar
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          Write-Host "Longitud LOCAL: $($env:LOCAL_DEV_TOKEN.Length)"
          Write-Host "Longitud DEV:   $($env:DEV_TOKEN.Length)"

      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "OK - Los tokens COINCIDEN"
          } else {
            Write-Host "ERROR - Los tokens NO coinciden"
            exit 1
          }