name: CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true # <-- Necesario para permitir el push

      - name: Incrementar versión
        run: |
          CURRENT=$(grep -oP 'AppVersion-\K[0-9]+' README.md | head -1)
          NEW=$((CURRENT + 1))
          sed -i "s/^AppVersion-[0-9]\+.*/AppVersion-$NEW - $(date '+%Y-%m-%d %H:%M:%S')/" README.md
          cat README.md

      - name: Commit del README (solo en push)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "cd: subir versión" || echo "Sin cambios"
          git push origin main        # <-- Especifica la rama destino correcta

  validate-token:
    needs: bump-version            
    runs-on: ubuntu-latest          
    steps:
      - name: Validar DEV_TOKEN
        env:
          SECRET_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if [ -n "$SECRET_TOKEN" ]; then
            echo "Token válido"
          else
            echo "Token inválido"
            exit 1
          fi